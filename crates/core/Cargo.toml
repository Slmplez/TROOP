[package]
name = "troop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
[dependencies]
troop-protocol = { path = "../protocol" }
troop-storage = { path = "../storage" }
troop-gateway = { path = "../gateway" }
troop-mcp = { path = "../mcp" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid.workspace = true
zeroize.workspace = true
sha2 = "=0.10.9"
regex = "=1.13.1"
base64 = "=0.23.1"
hmac = "=0.12.1"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls", "system-proxy"] }
subtle = "=2.6.1"
csv = "=1.4.0"
pulldown-cmark = { version = "=0.13.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
