[workspace]
resolver = "2"
members = ["crates/protocol", "crates/storage", "crates/gateway", "crates/core", "crates/mcp"]

[workspace.package]
version = "0.10.1"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "native-tls", "system-proxy"] }
futures-util = "=0.3.34"
uuid = { version = "=1.28.0", features = ["v4"] }
zeroize = "=1.9.1"
