name: TROOP Windows portable

on:
  pull_request:
    branches: [main]
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.*', '.github/workflows/troop-desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.*', '.github/workflows/troop-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.4.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Prepare locked desktop and Rust dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          cargo fetch --locked
          npm --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
          node apps/desktop/node_modules/electron/install.js
          node apps/desktop/scripts/prepare-sandbox.mjs
      - name: Build and verify the independent TROOP portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop/scripts/generate-client-contract.mjs --check
          cargo test --workspace --offline --locked
          npm --prefix apps/desktop run package:windows
          node apps/desktop/scripts/portable-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: troop-windows-${{ github.sha }}
          path: |
            .build/troop-desktop/*.zip
            verification/cli-followups-2026-11-09/portable-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
